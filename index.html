<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="./styles.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
     <title>Document</title>
</head>
<body>
     <div class="particles"></div>
     <img src="./img/ChatGPT Image May 12, 2026, 03_08_18 PM.png" id="money"></img>
     <main>
              <div>
                    <p id="text01">Converte <span class="de">de</span></p>
                    <input type="text" value="R$ Real Brasileiro" id="currency-selected" readonly>
                        

                    </input>

              </div> 
               <br>
               <div>
                    <p id="text02">Converte <span class="de">para</span></p>
                    <select value="US$ Dólar Americano" id="currency-select" readonly>
                         <option value="dolar">US$ Dólar Americano</option>
                         <option value="euro">€ Euro</option>
                         <option value="libra">£ Libra Esterlina</option>
                         <option value="bitcoin">Bitcoin</option>

                    </select>

              </div> 
               <br>
               <div>
                    <p class="de">Valor</p>
                    <input type="text" placeholder="R$ 10.000,00" id="dindin" ></input>

              </div> 

              <button  id="converter">Converter</button>

              <div id="div02">
                    <img id="imgchangecurrency" src="./img/real.png"></img>
                    <p class="moeda" id="changecurrency">Real</p>
                    <h3 class="value-to-convert">R$ 0,00</h3>

                    <img src="./img/seta.png" id="arrow">

                    <img id="currency-image" src="./img/dolar.png"></img>
                    <p class="moeda" id="currency-name">Dólar Americano</p>
                    <h3 class="valueconverted">US$ 0.0</h3>


              </div>
     </main>
     
</body>
<script src="./script.js"></script>
</html>
